<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla JS UI Test</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/header.js" defer></script>
  <script src="js/showcase.js" defer></script>
  <script src="js/modal.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header__top">
      <p class="header__top-promo">Акция: Бесплатная доставка при заказе от 100$!</p>
    </div>

    <div class="header__middle">
      <div class="container">
        <div class="header__middle-content">
          <div class="header__middle-item">
            <span>Телефон:</span>
            <a href="tel:+1234567890">+1 234 567 890</a>
          </div>

          <div class="header__middle-item">
            <span>Email:</span>
            <a href="mailto:info@example.com">info@example.com</a>
          </div>
        </div>
      </div>
    </div>

    <div class="header__main">
      <div class="container">
        <div class="header__main-content">
          <a href="#" class="logo">Logo</a>

          <nav class="header__menu">
            <ul>
              <li><a href="#" class="header__menu-item">Главная</a></li>
              <li><a href="#" class="header__menu-item">Каталог</a></li>
              <li><a href="#" class="header__menu-item">Контакты</a></li>
              <li><button id="contactBtn" class="header__menu-item" type="button">Связаться</button></li>
            </ul>
          </nav>

          <div class="header__burger">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="showcase">
      <div class="container">
      <h2 class="showcase__title">Витрина</h2>

      <div class="showcase__controls">
        <input
          id="searchInput"
          type="text"
          placeholder="Поиск"
          class="showcase__search"
        />

        <select id="categorySelect" class="showcase__select">
          <option value="Все">Все</option>
          <option value="Брендинг">Брендинг</option>
          <option value="Веб-дизайн">Веб-дизайн</option>
          <option value="Иллюстрации">Иллюстрации</option>
        </select>
      </div>

      <div id="showcaseGrid" class="showcase__grid"></div>
      </div>
    </section>
  </main>

  <footer id="footer" class="footer">
    <div class="container">
      <div class="footer__inner">
        <a class="footer__link" href="https://github.com/nick-konstantinov">GitHub</a>
      </div>
    </div>
  </footer>

  <div id="modal" class="modal hidden">
    <div class="modal__overlay"></div>

    <div class="modal__window">
      <button class="modal__close">&times;</button>

      <div class="modal__content"></div>
    </div>
  </div>
</body>
</html>
